[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-py"
version = "0.1.0"
description = "Demonstration of graph algorithms in Python 3.x"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "console-menu>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
